name-template: '$RESOLVED_VERSION'
tag-template: '$RESOLVED_VERSION'
change-template: '- #$NUMBER $TITLE by $AUTHORS'
category-template: '### $TITLE'
change-author-template: '$AUTHOR_MENTION'
change-authors-separator: ', '

template: |
  ## What's Changed

  $CHANGES

  ## New Contributors

  $NEW_CONTRIBUTORS

sort-by: 'title'
sort-direction: 'ascending'

include-commits: true

categories:
  - title: 'Security'
    semver-increment: patch
    when:
      labels:
        - 'security'
        - 'security fix'
        - 'security vulnerability'
  - title: 'Source'
    semver-increment: minor
    when:
      labels:
        - 'source'
  - title: 'Added'
    semver-increment: minor
    when:
      labels:
        - 'added'
        - 'feature'
        - 'enhancement'
  - title: 'Changed'
    semver-increment: minor
  - title: 'Fixed'
    semver-increment: patch
    when:
      labels:
        - 'fix'
        - 'bug'
        - 'bugfix'
  - title: 'Removed'
    semver-increment: major
    when:
      labels:
        - 'removed'
  - title: 'Machine translations'
    semver-increment: patch
    collapse-after: 20
    when:
      labels:
        - 'machine'
  - title: 'Dependencies'
    semver-increment: patch
    collapse-after: 10
    when:
      labels:
        - 'dependencies'
        - 'dependabot'
  - type: 'pre-exclude'
    when:
      labels:
        - 'skip-changelog'
        - 'github_actions'
        - 'code-style'
        - 'statuses'
