name: Release

on:
    workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  draft:
    name: Draft

    permissions:
        contents: write
        pull-requests: read

    runs-on: ubuntu-slim

    steps:
      - uses: release-drafter/release-drafter@v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
